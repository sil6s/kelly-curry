<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand · Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 36px 40px; background: #faf8f4; }
  .label { font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
  .swatch { padding: 28px; display: flex; align-items: center; justify-content: center; min-height: 100px; }
  .light { background: #fff; box-shadow: inset 0 0 0 1px rgba(46,43,38,0.08); }
  .dark { background: #28241f; }
  .dark img { filter: invert(1) hue-rotate(180deg) saturate(0.7) brightness(1.4); }
  .meta { font-family: var(--font-ui); font-size: 0.7rem; color: var(--muted); margin-top: 18px; letter-spacing: 0.04em; line-height: 1.7; }
</style>
</head>
<body>
  <div class="label">Logo · Wordmark + Sage Leaf</div>
  <div class="row">
    <div class="swatch light"><img src="../assets/logo.svg" alt="Kelly Baker Curry" height="46"/></div>
    <div class="swatch dark"><img src="../assets/logo.svg" alt="Kelly Baker Curry" height="46"/></div>
  </div>
  <div class="meta">Sage leaf mark in #7D8C76 · Playfair Display 500 wordmark · descriptor in 0.22em letter-spaced caps.</div>
</body>
</html>
