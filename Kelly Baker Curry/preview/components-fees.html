<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Component · Fee Blocks</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 0; background: #ede8df; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: #ede0c8; }
  .fee { background: #fff; padding: 52px 30px 48px; text-align: center; }
  .amt { font-family: var(--font-display); font-size: 3.2rem; font-weight: 400; color: var(--charcoal); line-height: 1; }
  .label { font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 18px; font-weight: 500; }
  .sub { font-family: var(--font-body); font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="fee">
      <div class="amt">$165</div>
      <div class="label">Individual</div>
      <div class="sub">50 minutes</div>
    </div>
    <div class="fee">
      <div class="amt">$195</div>
      <div class="label">Couples</div>
      <div class="sub">50 minutes</div>
    </div>
    <div class="fee">
      <div class="amt">$210</div>
      <div class="label">Family</div>
      <div class="sub">60 minutes</div>
    </div>
  </div>
</body>
</html>
