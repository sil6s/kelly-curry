<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Component · Eyebrow + Section Title</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 50px 56px; background: #faf8f4; }
  .eyebrow { font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--clay); font-weight: 500; margin-bottom: 22px; }
  h2 { font-family: var(--font-display); font-size: 2.4rem; font-weight: 500; color: var(--charcoal); line-height: 1.2; margin: 0; max-width: 18ch; }
  h2 em { font-style: italic; font-weight: 400; }
  .body { font-family: var(--font-body); font-size: 0.9rem; line-height: 1.88; color: var(--muted); max-width: 52ch; margin-top: 22px; }
</style>
</head>
<body>
  <div class="eyebrow">Our Approach</div>
  <h2>Therapy is a <em>relationship</em> before it is anything else.</h2>
  <div class="body">We meet weekly, sometimes more, and we talk. Over time the patterns become visible, and once they are visible they can change.</div>
</body>
</html>
