<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Component · Insurance Chips</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 40px 48px; background: #fff; }
  .label { font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-family: var(--font-ui); background: transparent; border: 1px solid rgba(46,43,38,0.22); padding: 9px 20px; font-size: 0.8rem; color: var(--charcoal); border-radius: 0; }
</style>
</head>
<body>
  <div class="label">Insurance Chips</div>
  <div class="row">
    <span class="chip">Aetna</span>
    <span class="chip">Anthem BCBS</span>
    <span class="chip">Cigna</span>
    <span class="chip">Humana</span>
    <span class="chip">United Healthcare</span>
    <span class="chip">Out of Network</span>
  </div>
</body>
</html>
