<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radii · Mostly Square</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 36px 40px; background: #fff; }
  .label { font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .item { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .shape { width: 96px; height: 60px; background: #ede8df; box-shadow: inset 0 0 0 1px rgba(46,43,38,0.10); }
  .shape.pill { width: 130px; height: 38px; border-radius: 30px; background: #c9a49a; box-shadow: none; }
  .shape.circle { width: 80px; height: 80px; border-radius: 50%; background: #ede8df; box-shadow: inset 0 0 0 2px rgba(196,168,130,0.35), 0 4px 20px rgba(46,43,38,0.10); }
  .name { font-family: var(--font-display); font-size: 0.95rem; font-weight: 500; color: var(--charcoal); }
  .meta { font-family: var(--font-ui); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="label">Corners</div>
  <div class="grid">
    <div class="item"><div class="shape"></div><div><div class="name">Square</div><div class="meta">0px · default</div></div></div>
    <div class="item"><div class="shape" style="border-radius:2px"></div><div><div class="name">Subtle</div><div class="meta">2px · rare</div></div></div>
    <div class="item"><div class="shape pill"></div><div><div class="name">Pill</div><div class="meta">30px · CTA only</div></div></div>
    <div class="item"><div class="shape circle"></div><div><div class="name">Circle</div><div class="meta">50% · avatar</div></div></div>
  </div>
</body>
</html>
