<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Type · Italic Mix</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 40px 48px; background: #f5f0e8; }
  .eyebrow { font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--clay); font-weight: 500; margin-bottom: 18px; }
  h1 { font-family: var(--font-display); font-size: 2.6rem; font-weight: 500; color: var(--charcoal); line-height: 1.15; margin: 0; max-width: 16ch; }
  h1 em { font-style: italic; font-weight: 400; }
  .caption { font-family: var(--font-ui); font-size: 0.7rem; color: var(--muted); margin-top: 24px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="eyebrow">Headline Style</div>
  <h1>A practice that <em>heals</em> from the inside out.</h1>
  <div class="caption">Mix italic + roman within a single Playfair line for emphasis.</div>
</body>
</html>
