<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing · Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 36px 40px; background: #fff; }
  .label { font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  .row { display: flex; align-items: center; gap: 22px; padding: 9px 0; }
  .name { width: 70px; font-family: var(--font-ui); font-size: 0.75rem; color: var(--charcoal); letter-spacing: 0.06em; }
  .val { width: 60px; font-family: var(--font-ui); font-size: 0.72rem; color: var(--muted); }
  .bar { background: #c4a882; height: 14px; }
</style>
</head>
<body>
  <div class="label">Spacing Scale</div>
  <div class="row"><div class="name">space-1</div><div class="val">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">space-2</div><div class="val">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">space-3</div><div class="val">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">space-4</div><div class="val">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">space-5</div><div class="val">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">space-6</div><div class="val">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">space-7</div><div class="val">48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">space-8</div><div class="val">64px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">space-9</div><div class="val">84px</div><div class="bar" style="width:84px"></div></div>
  <div class="row"><div class="name">space-10</div><div class="val">120px</div><div class="bar" style="width:120px"></div></div>
</body>
</html>
