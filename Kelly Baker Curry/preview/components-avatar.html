<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Component · Avatar</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 40px 48px; background: #faf8f4; }
  .label { font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  .row { display: flex; gap: 28px; align-items: center; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(196,168,130,0.35); box-shadow: 0 4px 20px rgba(46,43,38,0.10); background: #ede8df; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; display: block; }
  .meta { font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); line-height: 1.7; }
  .name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 500; color: var(--charcoal); display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="label">Profile Avatar</div>
  <div class="row">
    <div class="avatar"><img src="../assets/avatar-placeholder.svg" alt=""/></div>
    <div class="meta">
      <span class="name">Kelly Baker Curry, LCSW</span>
      110px · 50% radius · 2px clay-soft border<br/>
      Shadow 0 4px 20px rgba(46,43,38,0.10)
    </div>
  </div>
</body>
</html>
